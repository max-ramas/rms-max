name: RMSMax
options:
  bundleIdPrefix: dev.rms.maks
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.12.9"
    CURRENT_PROJECT_VERSION: "55"
    PRODUCT_NAME: "RMS MAKS"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_TEAM: UG53523VMB
    CODE_SIGN_STYLE: Automatic
packages:
  RMSMax:
    path: .
  Lottie:
    url: https://github.com/airbnb/lottie-ios.git
    exactVersion: 4.5.1
targets:
  RMSMax_macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/RMSMaxApp
      - path: XcodeSupport/Assets.xcassets
    dependencies:
      - package: RMSMax
        product: RMSMaxCore
      - package: Lottie
        product: Lottie
    info:
      path: XcodeSupport/macOS-Info.plist
      properties:
        CFBundleDisplayName: RMS MAKS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.social-networking
        NSCameraUsageDescription: "RMS MAKS использует камеру для зашифрованных видеозвонков."
        NSMicrophoneUsageDescription: "RMS MAKS использует микрофон для голосовых и видеозвонков."
        NSContactsUsageDescription: "RMS MAKS показывает адресную книгу, чтобы вы выбрали, кого найти в MAX. Номера отправляются на сервер MAX только для выбранных контактов."
        NSUserNotificationAlertStyle: alert
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: max
            CFBundleURLSchemes: [max]
    entitlements:
      path: XcodeSupport/macOS.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.addressbook: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rms.maks.macos
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: NO
  RMSMax_iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/RMSMaxApp
      - path: XcodeSupport/Assets.xcassets
    dependencies:
      - package: RMSMax
        product: RMSMaxCore
      - package: Lottie
        product: Lottie
    info:
      path: XcodeSupport/iOS-Info.plist
      properties:
        CFBundleDisplayName: RMS MAKS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: max
            CFBundleURLSchemes: [max]
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "RMS MAKS использует камеру для зашифрованных видеозвонков."
        NSMicrophoneUsageDescription: "RMS MAKS использует микрофон для голосовых и видеозвонков."
        NSContactsUsageDescription: "RMS MAKS показывает адресную книгу, чтобы вы выбрали, кого найти в MAX. Номера отправляются на сервер MAX только для выбранных контактов."
        NSFaceIDUsageDescription: "RMS MAKS использует Face ID для защиты локального хранилища и ключей."
        UIBackgroundModes:
          - audio
          - voip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rms.maks.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
schemes:
  RMSMax_macOS:
    build:
      targets:
        RMSMax_macOS: all
  RMSMax_iOS:
    build:
      targets:
        RMSMax_iOS: all
